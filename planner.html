<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boss Planner · MapleTools</title>
  <link rel="icon" type="image/png" href="app/mushroom.png?v=2610311921">
  <link rel="stylesheet" href="app/site.css?v=2610311921">
  <link rel="stylesheet" href="app/tracker.css?v=2610311921">
  <link rel="stylesheet" href="app/planner.css?v=2610311921">
</head>
<body>
  <header class="sitenav" id="sitenav" data-page="planner"></header>

  <main class="page">
    <div class="page-head">
      <div>
        <h1>Boss Planner</h1>
        <p id="planner-sub"></p>
      </div>
      <div class="seg" id="filter" aria-label="Show characters">
        <button data-filter="all">All</button>
        <button data-filter="open">Unfinished</button>
        <button data-filter="done">Finished</button>
        <button data-filter="hidden">Hidden</button>
      </div>
    </div>
    <section id="stats" class="stat-row"></section>
    <div id="players"></div>
  </main>

  <dialog id="pick-dialog" class="dialog pick-dialog">
    <form id="pick-form" method="dialog">
      <header class="pick-head">
        <h2 id="pick-title">Bosses</h2>
        <span id="pick-count" class="pick-count"></span>
      </header>
      <div class="pick-tools">
        <input id="pick-search" type="search" placeholder="Search bosses" autocomplete="off" aria-label="Search bosses">
        <div id="pick-presets" class="preset-list"></div>
      </div>
      <div id="pick-list" class="pick-list"></div>
      <div class="dialog-actions">
        <button type="button" id="pick-clear" class="btn ghost">Clear all</button>
        <span class="spacer"></span>
        <button type="button" class="btn ghost" data-close>Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </div>
    </form>
  </dialog>

  <script src="app/registry.js?v=2610311921"></script>
  <script src="app/site.js?v=2610311921"></script>
  <script src="data/classes/index.js?v=2610311921"></script>
  <script src="data/patches.js?v=2610311921"></script>
  <script src="data/bosses.js?v=2610311921"></script>
  <script src="app/config.js?v=2610311921"></script>
  <script src="app/party.js?v=2610311921"></script>
  <script src="app/arrange.js?v=2610311921"></script>
  <script src="app/bossing.js?v=2610311921"></script>
  <script src="app/planner.js?v=2610311921"></script>
</body>
</html>
