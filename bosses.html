<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boss Schedule · MapleTools</title>
  <link rel="icon" type="image/png" href="app/mushroom.png?v=2610311933">
  <link rel="stylesheet" href="app/site.css?v=2610311933">
  <link rel="stylesheet" href="app/bosses.css?v=2610311933">
</head>
<body>
  <header class="sitenav" id="sitenav" data-page="bosses"></header>

  <main class="page">
    <div class="page-head">
      <div>
        <h1>Boss Schedule</h1>
        <p id="boss-sub"></p>
      </div>
      <div class="head-buttons">
        <button id="arrange" class="btn">Arrange</button>
        <button id="add-group" class="btn primary">+ Add group</button>
      </div>
    </div>
    <section id="stats" class="stat-row"></section>
    <div id="sections"></div>
  </main>

  <dialog id="group-dialog" class="dialog dialog-wide">
    <form id="group-form" method="dialog">
      <h2 id="group-dialog-title">Add boss group</h2>
      <div class="fields">
        <div class="field span-2"><label for="g-title">Boss / group name</label>
          <input id="g-title" type="text" maxlength="40" required autocomplete="off" placeholder="e.g. Normal Kalos 1"></div>
        <label class="field span-2"><span>Resets</span>
          <select id="g-reset">
            <option value="weekly">Weekly (Thursday 00:00 UTC)</option>
            <option value="monthly">Monthly (1st of the month, Black Mage)</option>
            <option value="daily">Daily (00:00 UTC)</option>
          </select></label>
        <div class="field span-2"><span>Ticks in the Boss Planner <span id="g-covers-note" class="covers-note"></span></span>
          <div id="g-covers" class="cover-list"></div>
          </div>
      </div>
      <div class="field"><span>Members <span id="g-count"></span></span></div>
      <ul id="g-members" class="pick-list"></ul>
      <div class="add-member">
        <select id="g-add-char" aria-label="Add a character from the roster"></select>
        <span class="or">or</span>
        <input id="g-guest" type="text" maxlength="24" placeholder="Guest name">
        <button type="button" id="g-add-guest" class="btn small">Add</button>
      </div>
      <div class="dialog-actions">
        <button type="button" id="g-delete" class="btn ghost danger">Delete group</button>
        <span class="spacer"></span>
        <button type="button" class="btn ghost" data-close>Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </div>
    </form>
  </dialog>

  <script src="app/registry.js?v=2610311933"></script>
  <script src="app/site.js?v=2610311933"></script>
  <script src="data/classes/index.js?v=2610311933"></script>
  <script src="data/patches.js?v=2610311933"></script>
  <script src="data/bosses.js?v=2610311933"></script>
  <script src="data/boss-info.js?v=2610311933"></script>
  <script src="app/config.js?v=2610311933"></script>
  <script src="app/party.js?v=2610311933"></script>
  <script src="app/arrange.js?v=2610311933"></script>
  <script src="app/bossing.js?v=2610311933"></script>
  <script src="app/bosses.js?v=2610311933"></script>
</body>
</html>
