<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Characters · MapleTools</title>
  <link rel="stylesheet" href="app/site.css">
  <link rel="stylesheet" href="app/roster.css">
</head>
<body>
  <header class="sitenav" id="sitenav" data-page="roster"></header>

  <main class="page">
    <div class="page-head">
      <div>
        <h1>Characters</h1>
        <p id="roster-sub"></p>
      </div>
      <button id="add-char" class="btn primary">+ Add character</button>
    </div>

    <div class="roster-layout">
      <section id="roster" class="roster" aria-live="polite"></section>
      <aside class="roster-side">
        <section class="card" id="party"></section>
        <section class="card">
          <h2 class="card-title">Tools</h2>
          <div id="tools" class="tools"></div>
        </section>
      </aside>
    </div>
  </main>

  <dialog id="char-dialog" class="dialog">
    <form id="char-form" method="dialog">
      <h2 id="char-dialog-title">Add character</h2>
      <div class="fields">
        <label class="field span-2"><span>Character name</span><input id="char-name" type="text" maxlength="24" required autocomplete="off"></label>
        <label class="field span-2"><span>Class</span><select id="char-class"></select></label>
        <label class="field"><span>Level</span><input id="char-level" type="number" min="1" max="300" inputmode="numeric"></label>
        <label class="field"><span>Combat power (millions)</span><input id="char-cp" type="number" min="0" step="0.1" inputmode="decimal" placeholder="e.g. 160"></label>
      </div>
      <div class="dialog-actions">
        <button type="button" id="char-delete" class="btn ghost danger">Delete</button>
        <span class="spacer"></span>
        <button type="button" class="btn ghost" data-close>Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="party-dialog" class="dialog">
    <form id="party-form" method="dialog"></form>
  </dialog>

  <script src="app/registry.js"></script>
  <script src="app/site.js"></script>
  <script src="data/classes/index.js"></script>
  <script src="app/firebase-config.js"></script>
  <script src="app/party.js"></script>
  <script src="app/roster.js"></script>
</body>
</html>
